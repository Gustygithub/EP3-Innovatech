version: '3.8'

services:

  # Base de datos
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: despachos_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  # Backend Despachos
  back-despachos:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
    container_name: back_despachos
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/despachos_db
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: apppass
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net

  # Backend Ventas
  back-ventas:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
    container_name: back_ventas
    ports:
      - "8081:8080"
    networks:
      - backend_net

  # Frontend
  frontend:
    build:
      context: ./front_despacho
    container_name: frontend
    ports:
      - "80:80"
    networks:
      - backend_net

volumes:
  mysql_data:

networks:
  backend_net:
    driver: bridge